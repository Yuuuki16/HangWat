services:
  front:
    build:
      target: deps
    command: ["pnpm", "--filter", "front", "dev", "--hostname", "0.0.0.0"]
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./front:/app/front
      - front-node-modules:/app/front/node_modules
      - front-next:/app/front/.next

volumes:
  front-node-modules:
  front-next:
